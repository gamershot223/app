# WORKAI:PLATFORM-OWNED — файл принадлежит платформе WorkAI.
# This file is managed by the WorkAI platform. Do not edit it directly.
#
# Платформа сама переписывает этот конфиг при сборке образа: подставляет
# адреса своих сервисов вместо плейсхолдеров и дописывает недостающие
# блоки. Правка ломает публикацию МОЛЧА — образ соберётся, а маршруты,
# водяной знак и OG-превью просто перестанут работать, без единой ошибки.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Required: обе строки sub_filter ниже. Платформа ищет плейсхолдеры по
  # точному имени и молча ничего не делает, если их нет: у free-тарифа
  # исчезнет водяной знак, а у ссылок — превью в мессенджерах.
  # W17-2a: free-tier watermark (placeholder replaced at image build)
  sub_filter '</body>' '__WORKAI_WATERMARK_HTML__</body>';
  # W17-2e: per-project Open Graph meta (placeholder replaced at image build)
  sub_filter '<head>' '<head>__WORKAI_OG_META__';
  sub_filter_once on;

  # W20: platform end-user auth (placeholder replaced at image build)
  location /auth/ {
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-WorkAI-App-Host $host;
    proxy_set_header X-WorkAI-Client-IP $http_x_real_ip;
    proxy_set_header X-WorkAI-Proxy-Auth __WORKAI_PROXY_AUTH__;
    proxy_pass __WORKAI_APP_AUTH_UPSTREAM__;
  }

  # Required: путь /api/ и порт 3001 зашиты в клиентском apiUrl() и в
  # сайдкаре пода. Сменить префикс или порт = вся работа с БД отваливается.
  # W12-3: PostgREST sidecar on localhost:3001 (strip /api prefix)
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:3001/;
  }

  # W50: приём рантайм-ошибок приложения (плейсхолдер заменяется при сборке
  # образа). Проксируем через свой домен — кросс-доменный POST потребовал бы
  # CORS-preflight, а sendBeacon его не делает.
  location = /_workai/errors {
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-WorkAI-App-Host $host;
    proxy_set_header X-WorkAI-Client-IP $http_x_real_ip;
    proxy_set_header X-WorkAI-Proxy-Auth __WORKAI_PROXY_AUTH__;
    proxy_pass __WORKAI_APP_ERRORS_UPSTREAM__;
  }

  # W43: приём посещений сайта (плейсхолдер заменяется при сборке образа).
  # Через свой домен, как и ошибки: кросс-доменный POST потребовал бы
  # CORS-preflight, которого sendBeacon не делает.
  location = /_workai/hit {
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-WorkAI-App-Host $host;
    proxy_set_header X-WorkAI-Client-IP $http_x_real_ip;
    proxy_set_header X-WorkAI-Proxy-Auth __WORKAI_PROXY_AUTH__;
    proxy_pass __WORKAI_SITE_HITS_UPSTREAM__;
  }

  # W35: приём заявок с формы сайта (плейсхолдер заменяется при сборке
  # образа). Через свой домен, как и посещения: кросс-доменный POST потребовал
  # бы CORS-preflight, а форма шлёт text/plain, чтобы обойтись без него.
  location = /_workai/lead {
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-WorkAI-App-Host $host;
    proxy_set_header X-WorkAI-Client-IP $http_x_real_ip;
    proxy_set_header X-WorkAI-Proxy-Auth __WORKAI_PROXY_AUTH__;
    proxy_pass __WORKAI_LEADS_UPSTREAM__;
  }

  # W42: загрузка и отдача файлов приложения (плейсхолдер заменяется при
  # сборке образа). Свой домен вместо кросс-доменного запроса — как у auth и
  # приёмника ошибок.
  location /_workai/files/ {
    client_max_body_size 12m;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-WorkAI-App-Host $host;
    proxy_set_header X-WorkAI-Client-IP $http_x_real_ip;
    proxy_set_header X-WorkAI-Proxy-Auth __WORKAI_PROXY_AUTH__;
    proxy_pass __WORKAI_APP_FILES_UPSTREAM__;
  }

  # Required: SPA-фолбэк. Он же — якорь, по которому платформа дописывает
  # свои маршруты в конфиг уже опубликованного проекта; без него дописать
  # некуда, и проект навсегда останется без новых возможностей платформы.
  # Плюс k8s-проба опубликованного пода бьёт GET / на :80 — убрать блок или
  # сменить порт значит «под никогда не станет ready».
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
